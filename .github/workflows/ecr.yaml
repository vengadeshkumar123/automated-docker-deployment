
name: Build and Deploy to ECS Fargate

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: 354780327224.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/practice:$IMAGE_TAG ./proj
          docker push $REGISTRY/practice:$IMAGE_TAG

      - name: Force New Deployment
        run: |
          aws ecs update-service \
            --cluster project2-cluster \
            --service project2-service \
            --force-new-deployment

      - name: Wait for Deployment
        run: |
          aws ecs wait services-stable \
            --cluster project2-cluster \
            --services project2-service
